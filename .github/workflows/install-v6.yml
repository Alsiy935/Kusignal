name: Install PRO v6_2 ru

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract PRO v6_3 RU
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname '*PRO_v6_3_RU*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: PRO v6 RU ZIP not found"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf /tmp/pro
          mkdir -p /tmp/pro
          unzip -q "$ZIP" -d /tmp/pro

          SETTINGS=$(find /tmp/pro -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find /tmp/pro -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties README.md

          cp -R "$PROJECT_DIR/app" ./app
          cp "$PROJECT_DIR/settings.gradle" ./settings.gradle
          cp "$PROJECT_DIR/build.gradle" ./build.gradle

          if [ -f "$PROJECT_DIR/gradle.properties" ]; then
            cp "$PROJECT_DIR/gradle.properties" ./gradle.properties
          fi

          if [ -f "$PROJECT_DIR/README.md" ]; then
            cp "$PROJECT_DIR/README.md" ./README.md
          fi

          echo "Final project:"
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle settings.gradle gradle.properties README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install PRO v6 RU"
            git push
          fi
