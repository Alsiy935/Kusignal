name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            gettext \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev
          which autopoint
          autopoint --version

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython>=3,<4" buildozer==1.5.0

      - name: Verify project
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== BUILDOZER SPEC ==="
          cat buildozer.spec
          echo "=== REQUIREMENTS ==="
          cat requirements.txt
          test -f app/main.py

      - name: Build Android APK
        shell: bash
        run: |
          set +e
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          buildozer -v android debug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          exit $STATUS

      - name: Show error
        if: failure()
        shell: bash
        run: |
          echo "===== LAST 250 LINES ====="
          tail -n 250 build.log || true
          echo "===== ERRORS ====="
          grep -inE "error|failed|exception|traceback|fatal" build.log | tail -n 100 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-debug-apk
          path: bin/*.apk
          if-no-files-found: error
