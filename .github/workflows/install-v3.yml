name: Install PRO v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PRO v3
        run: |
          mkdir -p /tmp/pro
          unzip -o KuCoinSignalApp_PRO_v3.zip -d /tmp/pro

          cp -R /tmp/pro/app .
          cp /tmp/pro/build.gradle .
          cp /tmp/pro/settings.gradle .
          cp /tmp/pro/gradle.properties .
          cp /tmp/pro/README.md . || true

          rm KuCoinSignalApp_PRO_v3.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle settings.gradle gradle.properties README.md
          git commit -m "Install KuCoinSignalApp PRO v3" || echo "Nothing to commit"
          git push
