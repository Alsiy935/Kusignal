name: Install PRO v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PRO v3
        run: |
          unzip -o KuCoinSignalApp_PRO_v3.zip
          rm KuCoinSignalApp_PRO_v3.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install KuCoinSignalApp PRO v3" || echo "Nothing to commit"
          git push
