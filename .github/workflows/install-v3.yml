name: Install project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ZIP"

          rm -rf .install_tmp
          mkdir .install_tmp

          unzip -q -o "$ZIP" -d .install_tmp

          ROOT=".install_tmp"
          COUNT=$(find .install_tmp -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ]; then
            ONE=$(find .install_tmp -mindepth 1 -maxdepth 1 | head -1)
            if [ -d "$ONE" ]; then
              ROOT="$ONE"
            fi
          fi

          # Удаляем старый проект и ZIP,
          # но НЕ трогаем .github/workflows.
          rm -rf app tests bin project config.json buildozer.spec requirements.txt README.md .gitignore
          rm -f "$ZIP"

          # Копируем проект, исключая .github,
          # чтобы Actions не пытался изменить сам workflow.
          rsync -a --exclude='.github/' "$ROOT"/ ./

          rm -rf .install_tmp

      - name: Commit and push installed project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Install project from ZIP"
          git push
