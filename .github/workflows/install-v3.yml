name: Install project ZIP and build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -type f -name '*.zip' -not -path './.git/*' | head -n 1)"
          test -n "$ZIP"
          rm -rf .install_tmp
          mkdir -p .install_tmp
          unzip -q -o "$ZIP" -d .install_tmp

          ROOT=".install_tmp"
          mapfile -t TOP < <(find .install_tmp -mindepth 1 -maxdepth 1 -print)
          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          rm -rf app tests smoke bin project
          rm -f config.json buildozer.spec requirements.txt README.md .gitignore
          rsync -a --exclude='.github/' "$ROOT"/ ./

          rm -f "$ZIP"
          rm -rf .install_tmp

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py

      - name: Commit installed project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "Install SelfLearningTrader project"
            git push
          fi

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3" buildozer==1.5.0

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          
